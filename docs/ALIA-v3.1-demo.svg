<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">ALIA v3.1 workflow demo</title>
<desc id="desc">Animated walkthrough of running an audit, reviewing dashboard metrics, opening exceptions, searching, and inspecting device details.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b1626"/><stop offset="1" stop-color="#07111f"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#16283d"/><stop offset="1" stop-color="#0e1928"/></linearGradient>
  <filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="675" rx="20" fill="url(#bg)"/>
<text x="42" y="52" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="27" font-weight="700">ALIA v3.1 — audit workflow</text>
<text x="42" y="78" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="13">A visual walkthrough of the operational flow</text>

<g filter="url(#s)">
  <rect x="42" y="115" width="1116" height="435" rx="14" fill="#0c1725" stroke="#304a66"/>
</g>
<rect x="56" y="129" width="1088" height="34" rx="5" fill="#102033"/>
<text x="72" y="151" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="14" font-weight="700">ALIA</text>
<rect x="915" y="134" width="205" height="24" rx="4" fill="#00c853"/>
<text x="1017" y="151" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial" font-size="10" font-weight="700">RUN LICENSE AUDIT</text>

<g opacity="1">
  <rect x="70" y="185" width="300" height="92" rx="8" fill="url(#card)" stroke="#314a66"/>
  <text x="92" y="211" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="14" font-weight="700">Connection</text>
  <text x="92" y="236" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="12">GreenLake + Aruba Central</text>
  <text x="92" y="260" fill="#2dd4bf" font-family="Segoe UI,Arial" font-size="11">Connected</text>
</g>

<g>
  <rect x="394" y="185" width="318" height="92" rx="8" fill="url(#card)" stroke="#314a66"/>
  <text x="416" y="211" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="14" font-weight="700">Audit collection</text>
  <text x="416" y="236" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="12">GreenLake inventory</text>
  <text x="416" y="257" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="12">Central inventory + monitoring</text>
</g>

<g>
  <rect x="736" y="185" width="378" height="92" rx="8" fill="url(#card)" stroke="#314a66"/>
  <text x="758" y="211" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="14" font-weight="700">Reconciliation</text>
  <text x="758" y="236" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="12">Serial number → MAC address</text>
  <text x="758" y="257" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="12">Audit classifications</text>
</g>

<g>
  <rect x="70" y="302" width="1044" height="98" rx="8" fill="#0b1624" stroke="#314a66"/>
  <text x="92" y="328" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="14" font-weight="700">Dashboard</text>
  <text x="92" y="354" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="12">Inventory</text><text x="196" y="354" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="12">Licensed</text><text x="300" y="354" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="12">Monitored</text><text x="414" y="354" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="12">Exceptions</text><text x="537" y="354" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="12">Coverage</text>
  <text x="92" y="380" fill="#60a5fa" font-family="Segoe UI,Arial" font-size="18" font-weight="700">3505</text><text x="196" y="380" fill="#22c55e" font-family="Segoe UI,Arial" font-size="18" font-weight="700">2407</text><text x="300" y="380" fill="#22d3ee" font-family="Segoe UI,Arial" font-size="18" font-weight="700">2336</text><text x="414" y="380" fill="#f87171" font-family="Segoe UI,Arial" font-size="18" font-weight="700">731</text><text x="537" y="380" fill="#60a5fa" font-family="Segoe UI,Arial" font-size="18" font-weight="700">86.16%</text>
</g>

<g>
  <rect x="70" y="425" width="1044" height="94" rx="8" fill="url(#card)" stroke="#314a66"/>
  <text x="92" y="451" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="14" font-weight="700">Investigate</text>
  <rect x="92" y="463" width="185" height="28" rx="4" fill="#184c96"/><text x="184" y="482" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial" font-size="10">Exception device</text>
  <rect x="291" y="463" width="205" height="28" rx="4" fill="#101d2d" stroke="#334b66"/><text x="394" y="482" text-anchor="middle" fill="#dbe3ed" font-family="Segoe UI,Arial" font-size="10">Search / filter</text>
  <rect x="510" y="463" width="245" height="28" rx="4" fill="#101d2d" stroke="#334b66"/><text x="632" y="482" text-anchor="middle" fill="#dbe3ed" font-family="Segoe UI,Arial" font-size="10">Device Details</text>
</g>

<text x="42" y="598" fill="#2dd4bf" font-family="Segoe UI,Arial" font-size="12" font-weight="700">Run → Collect → Reconcile → Identify → Investigate → Export</text>
<text x="42" y="623" fill="#64748b" font-family="Segoe UI,Arial" font-size="11">Static preview + lightweight animated walkthrough. Live counts are produced by the audit run.</text>
</svg>