name: ALIA v3.1 Validation

on:
  push:
    branches:
      - v3.1
  pull_request:
    branches:
      - v3.1

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v3.1 PowerShell syntax
        shell: pwsh
        run: |
          $files = @('ALIA-v3.1.ps1','Build-ALIA-v3.1.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-Host
              throw "PowerShell parse validation failed for $file"
            }
          }
          Write-Host "PowerShell syntax validation passed."

      - name: Install analysis modules
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber

      - name: Run static analysis
        shell: pwsh
        run: |
          $target = 'ALIA-v3.1.ps1'
          $result = Invoke-ScriptAnalyzer -Path (Join-Path $PWD $target) -Severity Error -Recurse
          $result | Format-Table -AutoSize | Out-Host
          if ($result.Count -gt 0) {
            throw "PSScriptAnalyzer reported $($result.Count) error-severity issue(s) in $target."
          }
          Write-Host "PSScriptAnalyzer passed for the canonical ALIA v3.1 source."

      - name: Run ALIA v3.1 GUI smoke tests
        shell: pwsh
        run: |
          $source = Get-Content (Join-Path $PWD 'ALIA-v3.1.ps1') -Raw

          $requiredFeatures = @(
            'AUDIT HEALTH',
            'Healthy Audit Results',
            'Device Details',
            'Audit History',
            'Coverage',
            'All Audit Results',
            'RUN LICENSE AUDIT',
            'Show Audit Log',
            'Central Inventory',
            'Exceptions'
          )

          foreach ($feature in $requiredFeatures) {
            if ($source.IndexOf($feature, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Expected GUI feature not found: $feature"
            }
          }

          foreach ($functionName in @(
            'Normalize-Serial',
            'Normalize-Mac',
            'Get-CentralHealthState',
            'Get-AuditHealth',
            'New-GridColumnFilterMenu',
            'Get-GridBaseObjects'
          )) {
            if ($source.IndexOf("function $functionName", [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Expected function not found: $functionName"
            }
          }

          if ($source.IndexOf('StatusButtons', [System.StringComparison]::OrdinalIgnoreCase) -ge 0 -or
              $source.IndexOf('New-QuickViewButton', [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
            throw "Legacy Audit Status button strip is still present."
          }

          if ($source.IndexOf("$script:btnShowAll", [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
            throw "All reconciliation button is missing."
          }

          if ($source.IndexOf("Show-View -View Audit -Title 'All Audit Results'", [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
            throw "All button is not wired to the raw Audit view."
          }

          foreach ($gridFeature in @(
            'New-GridColumnFilterMenu',
            'CellContextMenuStripNeeded',
            'Clear All Column Filters',
            'Right-click a column header to filter'
          )) {
            if ($source.IndexOf($gridFeature, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Expected grid filtering feature not found: $gridFeature"
            }
          }

          foreach ($legacyControl in @(
            'cmbAuditStatus',
            'cmbHealth',
            'cmbDeviceType',
            'btnResetFilters'
          )) {
            if ($source.IndexOf($legacyControl, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "Legacy standalone filter control is still present: $legacyControl"
            }
          }

          foreach ($darkFeature in @(
            'DarkTheme',
            'New-ALIAIconBitmap',
            'Set-ALIAKpiIcons',
            'Set-ALIAHealthIcons',
            'RUN LICENSE AUDIT',
            'Search devices...',
            'Set-ALIANativeWindowTheme',
            'Set-ALIADataGridScrollbars',
            'Update-ResponsiveLayout'
          )) {
            if ($source.IndexOf($darkFeature, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Expected v3.1 feature not found: $darkFeature"
            }
          }

          if ($source.IndexOf('Add-ALIAIconToLabel', [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
            throw "Legacy Unicode icon-label overlay is still present in v3.1 source."
          }

          Write-Host "ALIA v3.1 GUI smoke tests passed."


      - name: Build ALIA v3.1 EXE
        shell: powershell
        run: |
          & (Join-Path $PWD 'Build-ALIA-v3.1.ps1')

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/ALIA-v3.1.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected EXE not found: $exe"
          }

          $item = Get-Item $exe
          if ($item.Length -le 0) {
            throw "EXE was created but is empty."
          }

          Write-Host "Built EXE size: $([Math]::Round($item.Length / 1MB,2)) MB"
          Write-Host "ALIA v3.1 validation and packaging passed."
