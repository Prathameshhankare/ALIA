name: ALIA v3.2 Validation

on:
  push:
    branches:
      - main
      - v3.2
  pull_request:
    branches:
      - main
      - v3.2

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v3.2 PowerShell syntax
        shell: pwsh
        run: |
          $files = @('ALIA-v3.2.ps1', 'Build-ALIA-v3.2.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-Host
              throw "PowerShell parse validation failed for $file"
            }
          }
          Write-Host 'PowerShell syntax validation passed.'

      - name: Install analysis modules
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber

      - name: Run static analysis
        shell: pwsh
        run: |
          $target = 'ALIA-v3.2.ps1'
          $result = Invoke-ScriptAnalyzer -Path (Join-Path $PWD $target) -Severity Error -Recurse
          $result | Format-Table -AutoSize | Out-Host
          if ($result.Count -gt 0) {
            throw "PSScriptAnalyzer reported $($result.Count) error-severity issue(s) in $target."
          }
          Write-Host 'PSScriptAnalyzer passed for the canonical ALIA v3.2 source.'

      - name: Check v3.2 DPI and responsive layout features
        shell: pwsh
        run: |
          $source = Get-Content (Join-Path $PWD 'ALIA-v3.2.ps1') -Raw
          $requiredFeatures = @(
            'SetProcessDpiAwarenessContext',
            'Get-ALIADpiScale',
            'Convert-ALIAValue',
            'Position-ActionPanel',
            'Position-HealthCard',
            'Position-KpiCard',
            'Position-DetailHeader',
            'Add_DpiChanged'
          )

          foreach ($feature in $requiredFeatures) {
            if ($source.IndexOf($feature, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Expected v3.2 layout feature not found: $feature"
            }
          }
          Write-Host 'v3.2 DPI and responsive layout feature checks passed.'

      - name: Test responsive layout at common DPI scales
        shell: powershell
        run: '& (Join-Path $PWD ''.github\scripts\Test-ALIA-v3.2-layout.ps1'')'

      - name: Build ALIA v3.2 EXE
        shell: powershell
        run: '& (Join-Path $PWD ''Build-ALIA-v3.2.ps1'')'

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/ALIA-v3.2.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected EXE not found: $exe"
          }

          $item = Get-Item $exe
          if ($item.Length -le 0) {
            throw 'EXE was created but is empty.'
          }

          Write-Host "Built EXE size: $([Math]::Round($item.Length / 1MB, 2)) MB"
          Write-Host 'ALIA v3.2 validation and packaging passed.'
